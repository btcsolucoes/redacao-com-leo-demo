<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Redação com Léo - Demo</title>
  <link rel="icon" href="./assets/favicon.svg" />
  <link rel="manifest" href="./assets/manifest.webmanifest" />
  <style>
    @font-face{font-family:Fredoka;src:url("./assets/fonts/fredoka-latin.woff2") format("woff2");font-weight:300 700;font-display:swap}
    @font-face{font-family:Nunito;src:url("./assets/fonts/nunito-latin.woff2") format("woff2");font-weight:300 900;font-display:swap}
    :root{--wine:#650007;--red:#d70b1a;--rose:#fff1f3;--pink:#ffccd5;--peach:#ffd6ba;--mint:#cdeccd;--sky:#cfe9ff;--ink:#251013;--muted:#7b5660;--paper:#fffaf7;--card:#fff;--line:#f3ccd2;--shadow:0 14px 36px rgba(101,0,7,.14)}
    *{box-sizing:border-box} html,body,#app{min-height:100%;margin:0} body{font-family:Nunito,system-ui,sans-serif;background:linear-gradient(180deg,#fff7f2,#fff0f4 42%,#f7fff9);color:var(--ink);letter-spacing:0}
    button,input,textarea,select{font:inherit} button{border:0;cursor:pointer} img{max-width:100%;display:block}
    .phone{max-width:430px;min-height:100dvh;margin:auto;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 0 1px #f7d7dc}
    .top{position:sticky;top:0;z-index:5;background:rgba(255,250,247,.94);backdrop-filter:blur(18px);padding:14px 16px 10px;border-bottom:1px solid #f7d8de;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img.logo{width:118px;height:auto}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 6px 18px rgba(101,0,7,.18)}
    .main{padding:16px 14px 96px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:8;width:min(430px,100%);padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(255,250,247,.96);border-top:1px solid #f2ccd2;backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
    .nav button{height:58px;border-radius:18px;background:transparent;color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:800}.nav button b{font-size:22px;line-height:18px}.nav button.on{background:linear-gradient(135deg,#fff,#ffe1e7);color:var(--red);box-shadow:0 8px 18px rgba(215,11,26,.13)}
    .login{min-height:100dvh;padding:34px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 20% 10%,#ffd6ba 0 20%,transparent 21%),radial-gradient(circle at 86% 20%,#cfe9ff 0 17%,transparent 18%),linear-gradient(180deg,#fff4f1,#fff)}
    .login .logo{width:min(320px,82vw);margin-bottom:14px}.hello{font-family:Fredoka,sans-serif;font-size:34px;line-height:1.02;margin:8px 0;color:var(--wine)}.login p{margin:0 0 20px;color:var(--muted)}
    .rolegrid{display:grid;gap:12px;width:100%;max-width:330px}.role{padding:16px;border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;text-align:left}.role strong{display:block;font-family:Fredoka;font-size:20px;color:var(--wine)}.role span{color:var(--muted);font-size:13px}
    .pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:9px 12px;background:#fff;border:1px solid var(--line);color:var(--wine);font-weight:900}.btn{border-radius:18px;padding:13px 16px;background:var(--wine);color:#fff;font-weight:900;box-shadow:0 10px 22px rgba(101,0,7,.18)}.btn.red{background:var(--red)}.btn.soft{background:#fff;color:var(--wine);border:1px solid var(--line);box-shadow:none}.btn.full{width:100%}
    h1,h2,h3{font-family:Fredoka,sans-serif;letter-spacing:0;color:var(--wine)} h1{font-size:30px;margin:8px 0 4px} h2{font-size:24px;margin:18px 0 10px} h3{font-size:19px;margin:0 0 6px} p{line-height:1.42}.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;gap:12px}.twocol{grid-template-columns:1fr 1fr}.card{border-radius:24px;background:var(--card);border:1px solid var(--line);padding:15px;box-shadow:0 12px 28px rgba(101,0,7,.08)}.softband{border-radius:26px;padding:16px;background:linear-gradient(135deg,#ffe8ed,#fff8d9 48%,#dff7ff);border:1px solid #f7d4da}
    .metric{border-radius:22px;padding:14px;background:#fff;border:1px solid #f5d2d8}.metric b{font-family:Fredoka;font-size:28px;color:var(--red);display:block}.tag{display:inline-flex;border-radius:999px;padding:6px 10px;background:#fff2f4;color:var(--wine);font-size:12px;font-weight:900}.tag.green{background:#e9f7e9}.tag.blue{background:#eaf5ff}.tag.yellow{background:#fff2ca}
    .list{display:grid;gap:10px}.item{border-radius:20px;padding:13px;background:#fff;border:1px solid #f3d3d8}.item.active{outline:3px solid #ffd4dc}.score{font-family:Fredoka;font-size:28px;color:var(--red)}.bar{height:10px;background:#ffe0e6;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#d70b1a,#ff9cb0);border-radius:inherit}
    .tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 10px}.tabs button{white-space:nowrap;border-radius:999px;padding:10px 13px;background:#fff;border:1px solid var(--line);font-weight:900;color:var(--muted)}.tabs button.on{background:var(--wine);color:#fff}
    input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:18px;padding:13px 14px;color:var(--ink);outline:none} textarea{min-height:132px;resize:vertical}.field{display:grid;gap:6px}.field label{font-weight:900;color:var(--wine);font-size:13px}
    .chat{display:grid;gap:9px}.bubble{max-width:84%;padding:11px 13px;border-radius:19px;background:#fff;border:1px solid var(--line)}.bubble.me{justify-self:end;background:#ffe4ea}.composer{position:sticky;bottom:75px;display:flex;gap:8px;padding-top:8px;background:linear-gradient(180deg,transparent,var(--paper) 28%)}
    .modal{position:fixed;inset:0;z-index:20;background:rgba(37,16,19,.42);display:none;align-items:end;justify-content:center}.modal.on{display:flex}.sheet{width:min(430px,100%);max-height:90dvh;overflow:auto;border-radius:28px 28px 0 0;background:var(--paper);padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 45px rgba(37,16,19,.2)}
    .camera{border:2px dashed #efb8c0;border-radius:24px;padding:16px;text-align:center;background:#fff}.preview{margin-top:10px;border-radius:20px;max-height:220px;width:100%;object-fit:cover}.qr{width:184px;height:184px;margin:10px auto;border-radius:18px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
    .video{aspect-ratio:4/5;border-radius:28px;background:linear-gradient(160deg,#2c0710,#8b0712);position:relative;overflow:hidden;color:#fff;display:grid;place-items:center;text-align:center;padding:18px}.video video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.round{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--wine);font-weight:900;box-shadow:0 10px 18px rgba(37,16,19,.14)}
    .empty{text-align:center;padding:26px 14px;color:var(--muted)}.loading{min-height:100dvh;display:grid;place-items:center;text-align:center;background:#fff4f6}.loading img{width:120px;border-radius:50%;margin:auto;border:6px solid #fff;box-shadow:var(--shadow)}.shake{animation:bob 1.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}} @media(min-width:700px){body{background:linear-gradient(135deg,#640007,#fff4f1 34%,#fff)}.phone{margin:26px auto;min-height:850px;border-radius:38px;box-shadow:0 32px 80px rgba(37,16,19,.28)}.nav{border-radius:28px 28px 0 0}.login{border-radius:38px;min-height:850px}} 
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
  <script>
  const $ = (s, r=document) => r.querySelector(s);
  const app = $("#app"), modal = $("#modal"), sheet = $("#sheet");
  const storeKey = "redacao_com_leo_pages_v2";
  const views = {student:["home","essays","lessons","chat","pay"], manager:["home","students","review","chat","pay"]};
  const navLabel = {home:["⌂","Início"],essays:["✎","Redações"],lessons:["◴","Aulas"],chat:["✉","Chat"],pay:["◇","Pix"],students:["♚","Alunos"],review:["✓","Correção"]};
  let role = sessionStorage.getItem("leo_role") || "";
  let view = sessionStorage.getItem("leo_view") || "home";
  let currentImage = "";
  let cameraStream = null;
  const seed = {student:{name:"Maria Clara",plan:"Mentoria ENEM",goal:920},manager:{name:"Leonardo Costa"},payments:[{id:"PIX-0911",student:"Maria Clara",value:297,status:"aberto",due:"Hoje"}],essays:[{id:"R1",student:"Maria Clara",theme:"Desafios da educação digital no Brasil",text:"A tecnologia mudou a forma como os estudantes aprendem. Ainda assim, o acesso desigual dificulta que todos aproveitem esses recursos. Para enfrentar esse problema, escolas e governos precisam ampliar infraestrutura e orientar o uso responsável das plataformas digitais.",status:"Corrigida",score:880,competencies:[180,180,160,180,180],strengths:"Boa defesa do ponto de vista e repertório bem encaixado.",improve:"A conclusão pode detalhar melhor o agente e o meio de execução.",feedback:"Texto claro, organizado e com boa progressão. Revise repetições e aprofunde a proposta de intervenção."},{id:"R2",student:"Maria Clara",theme:"Caminhos para combater a evasão escolar",text:"",status:"Pendente",score:null,competencies:[0,0,0,0,0],strengths:"",improve:"",feedback:""}],lessons:[{id:"A1",title:"Repertório na introdução",date:"12/09",time:"18:30",status:"Confirmada"},{id:"A2",title:"Correção ao vivo",date:"15/09",time:"19:00",status:"Aberta"}],messages:[{from:"Leonardo",text:"Oi, Maria. Sua última redação já está corrigida."},{from:"Maria Clara",text:"Obrigada, prof! Vou ajustar a conclusão."}]};
  const read = () => JSON.parse(localStorage.getItem(storeKey) || JSON.stringify(seed));
  const save = (data) => localStorage.setItem(storeKey, JSON.stringify(data));
  const money = (n) => n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  function boot(){app.innerHTML='<div class="loading"><div><img class="shake" src="./assets/leonardo-avatar.png"><h1>Redação com Léo</h1><p class="muted">Abrindo sua sala de estudos...</p></div></div>';setTimeout(render,420)}
  function render(){ if(!role) return login(); if(!views[role].includes(view)) view="home"; const data=read(); app.innerHTML='<div class="phone">'+appHeader(data)+main(data)+nav()+'</div>'; bind(); }
  function appHeader(data){return '<header class="top"><div class="brand"><img class="logo" src="./assets/logo.png"><span class="pill">'+(role==="student"?"Aluno":"Gestor")+'</span></div><button class="pill" data-action="swap"><img class="avatar" src="./assets/leonardo-avatar.png" alt=""> trocar</button></header>'}
  function nav(){return '<nav class="nav">'+views[role].map(v=>'<button class="'+(view===v?'on':'')+'" data-nav="'+v+'"><b>'+navLabel[v][0]+'</b><span>'+navLabel[v][1]+'</span></button>').join("")+'</nav>'}
  function main(data){return '<main class="main">'+(role==="student"?student(data):manager(data))+'</main>'}
  function login(){app.innerHTML='<div class="login"><img class="logo" src="./assets/logo.png"><img class="avatar" style="width:86px;height:86px" src="./assets/leonardo-avatar.png"><h1 class="hello">Escolha o acesso</h1><p>A demonstração abre com dados prontos para apresentação.</p><div class="rolegrid"><button class="role" data-login="student"><span class="avatar" style="display:grid;place-items:center;background:#ffe4ea">✎</span><span><strong>Aluno</strong><span>Redações, aulas, chat e Pix</span></span></button><button class="role" data-login="manager"><span class="avatar" style="display:grid;place-items:center;background:#eaf5ff">♚</span><span><strong>Gestor</strong><span>Pagamentos, notas e correções</span></span></button></div></div>';bind()}
  function student(d){ if(view==="home") return homeStudent(d); if(view==="essays") return essays(d); if(view==="lessons") return lessons(d); if(view==="chat") return chat(d); return payments(d)}
  function manager(d){ if(view==="home") return homeManager(d); if(view==="students") return students(d); if(view==="review") return review(d); if(view==="chat") return chat(d); return payments(d)}
  function homeStudent(d){const last=d.essays.find(e=>e.score);return '<section class="softband"><h1>Oi, '+d.student.name.split(" ")[0]+'</h1><p class="muted">Tudo que importa está a um toque.</p><div class="grid twocol"><div class="metric"><b>'+last.score+'</b><span>última nota</span></div><div class="metric"><b>'+d.lessons.length+'</b><span>aulas</span></div></div></section><h2>Agora</h2><div class="grid"><button class="card row" data-modal="newEssay"><span><h3>Enviar redação</h3><span class="muted">Foto, texto ou arquivo</span></span><span class="score">+</span></button><button class="card row" data-view="lessons"><span><h3>Entrar na aula</h3><span class="muted">'+d.lessons[0].date+' às '+d.lessons[0].time+'</span></span><span class="tag blue">ao vivo</span></button><button class="card row" data-modal="video"><span><h3>Sala com câmera</h3><span class="muted">vídeo e tela compartilhada</span></span><span class="tag green">abrir</span></button></div>'}
  function homeManager(d){const paid=d.payments.filter(p=>p.status==="pago").reduce((a,p)=>a+p.value,0);return '<section class="softband"><h1>Painel do Léo</h1><p class="muted">Alunos, pagamentos e correções no mesmo caminho.</p><div class="grid twocol"><div class="metric"><b>'+d.essays.length+'</b><span>redações</span></div><div class="metric"><b>'+money(paid)+'</b><span>recebido</span></div></div></section><h2>Fila de hoje</h2>'+review(d)+'<button class="btn full" data-modal="video">Abrir sala de vídeo</button>'}
  function essays(d){return '<div class="row"><h1>Redações</h1><button class="btn red" data-modal="newEssay">Enviar</button></div><div class="list">'+d.essays.map(e=>'<article class="item"><div class="row"><h3>'+e.theme+'</h3><span class="tag '+(e.status==="Corrigida"?"green":"yellow")+'">'+e.status+'</span></div>'+(e.score?'<div class="score">'+e.score+'</div><p>'+e.feedback+'</p><div class="bar"><i style="width:'+(e.score/10)+'%"></i></div>':'<p class="muted">Aguardando correção do gestor.</p>')+'</article>').join("")+'</div>'}
  function lessons(d){return '<div class="row"><h1>Aulas</h1><button class="btn red" data-modal="lesson">Agendar</button></div><div class="list">'+d.lessons.map(a=>'<article class="item"><div class="row"><h3>'+a.title+'</h3><span class="tag blue">'+a.status+'</span></div><p class="muted">'+a.date+' às '+a.time+'</p><button class="btn soft" data-modal="video">Entrar</button></article>').join("")+'</div>'}
  function students(d){return '<h1>Alunos</h1><div class="list"><article class="card"><div class="row"><h3>Maria Clara</h3><span class="score">880</span></div><p class="muted">Plano '+d.student.plan+' · meta '+d.student.goal+'</p><div class="bar"><i style="width:88%"></i></div></article><article class="card"><div class="row"><h3>João Pedro</h3><span class="score">760</span></div><p class="muted">Turma intensiva · 2 pendências</p><div class="bar"><i style="width:76%"></i></div></article></div>'}
  function review(d){const rows=d.essays.map(e=>'<article class="item"><div class="row"><h3>'+e.theme+'</h3><span class="tag">'+e.student+'</span></div><p class="muted">'+(e.text||"Texto enviado por imagem, pronto para correção.")+'</p><button class="btn soft" data-modal="correct" data-id="'+e.id+'">Corrigir</button></article>').join("");return '<div class="row"><h1>Correção</h1><span class="pill">'+d.essays.filter(e=>e.status==="Pendente").length+' pendente</span></div><div class="list">'+rows+'</div>'}
  function payments(d){return '<div class="row"><h1>Pix</h1><button class="btn red" data-modal="payment">Gerar</button></div><div class="list">'+d.payments.map(p=>'<article class="card"><div class="row"><h3>'+p.student+'</h3><span class="tag '+(p.status==="pago"?"green":"yellow")+'">'+p.status+'</span></div><p class="muted">'+p.id+' · vence '+p.due+'</p><div class="score">'+money(p.value)+'</div><button class="btn soft" data-modal="qr" data-id="'+p.id+'">Ver QR Code</button></article>').join("")+'</div>'}
  function chat(d){return '<h1>Chat</h1><div class="chat">'+d.messages.map(m=>'<div class="bubble '+((role==="student"&&m.from==="Maria Clara")||(role==="manager"&&m.from==="Leonardo")?'me':'')+'"><b>'+m.from+'</b><br>'+m.text+'</div>').join("")+'</div><form class="composer" data-form="chat"><input name="text" placeholder="Escrever mensagem"><button class="btn red">Enviar</button></form>'}
  function openModal(kind,id){const d=read(); if(kind==="newEssay") sheet.innerHTML='<h2>Enviar redação</h2><form class="grid" data-form="essay"><div class="field"><label>Tema</label><input name="theme" required placeholder="Tema da redação"></div><div class="camera"><b>Digitalizar redação</b><p class="muted">Use a câmera ou escolha uma foto.</p><input type="file" accept="image/*" capture="environment" data-file><img class="preview" id="preview" style="display:none"></div><button type="button" class="btn soft" data-action="ocr">Ler imagem</button><div class="field"><label>Texto</label><textarea name="text" placeholder="Cole ou revise o texto reconhecido"></textarea></div><button class="btn red">Enviar</button></form>';
    if(kind==="lesson") sheet.innerHTML='<h2>Agendar aula</h2><form class="grid" data-form="lesson"><input name="title" placeholder="Título da aula" required><input name="date" placeholder="Data, ex: 18/09" required><input name="time" placeholder="Horário, ex: 19:30" required><button class="btn red">Salvar horário</button></form>';
    if(kind==="payment") sheet.innerHTML='<h2>Gerar Pix</h2><form class="grid" data-form="payment"><input name="student" placeholder="Aluno" value="Maria Clara"><input name="value" type="number" placeholder="Valor" value="297"><button class="btn red">Gerar guia</button></form>';
    if(kind==="qr"){const p=d.payments.find(x=>x.id===id);sheet.innerHTML='<h2>Guia Pix</h2><p class="muted">'+p.id+' · '+money(p.value)+'</p><canvas class="qr" id="qr" width="184" height="184"></canvas><p class="tag">Chave Pix: redacao@comleo.demo</p><button class="btn red full" data-pay="'+p.id+'">Confirmar pagamento</button>';setTimeout(()=>drawQr(id),20)}
    if(kind==="correct"){const e=d.essays.find(x=>x.id===id);sheet.innerHTML='<h2>Corrigir redação</h2><form class="grid" data-form="correct" data-id="'+id+'"><p class="muted">'+e.theme+'</p><input name="score" type="number" min="0" max="1000" value="'+(e.score||860)+'"><textarea name="strengths" placeholder="Pontos fortes">'+(e.strengths||"Boa organização das ideias.")+'</textarea><textarea name="improve" placeholder="Pontos a melhorar">'+(e.improve||"Aprofundar repertório e fechar melhor a intervenção.")+'</textarea><textarea name="feedback" placeholder="Feedback">'+(e.feedback||"Texto com caminho claro. Ajuste coesão entre parágrafos e detalhe a proposta.")+'</textarea><button class="btn red">Salvar correção</button></form>'}
    if(kind==="video") sheet.innerHTML='<h2>Sala de aula</h2><div class="video" id="videoBox"><img class="avatar" style="width:96px;height:96px" src="./assets/leonardo-avatar.png"><div><h3 style="color:#fff">Leonardo Costa</h3><p>Aguardando câmera</p></div></div><div class="controls"><button class="round" title="Câmera" data-video="cam">▣</button><button class="round" title="Tela" data-video="screen">▤</button><button class="round" title="Microfone" data-video="mic">◉</button><button class="round" title="Sair" data-close>×</button></div>';
    modal.classList.add("on"); bind(); }
  function closeModal(){modal.classList.remove("on");sheet.innerHTML=""; if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
  function drawQr(text){const c=$("#qr"),x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,184,184);for(let y=0;y<23;y++)for(let i=0;i<23;i++){if((i*y+text.charCodeAt((i+y)%text.length)+i+y)%3===0){x.fillStyle=i<7&&y<7||i>15&&y<7||i<7&&y>15?"#650007":"#d70b1a";x.fillRect(i*8,y*8,6,6)}}}
  function bind(){document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{view=b.dataset.nav;sessionStorage.setItem("leo_view",view);render()});document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;sessionStorage.setItem("leo_view",view);render()});document.querySelectorAll("[data-login]").forEach(b=>b.onclick=()=>{role=b.dataset.login;view="home";sessionStorage.setItem("leo_role",role);render()});document.querySelectorAll("[data-action='swap']").forEach(b=>b.onclick=()=>{role="";sessionStorage.removeItem("leo_role");login()});document.querySelectorAll("[data-modal]").forEach(b=>b.onclick=()=>openModal(b.dataset.modal,b.dataset.id));document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);modal.onclick=e=>{if(e.target===modal)closeModal()};const file=$("[data-file]");if(file)file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{currentImage=r.result;$("#preview").src=currentImage;$("#preview").style.display="block"};r.readAsDataURL(f)};document.querySelectorAll("form").forEach(f=>f.onsubmit=submit);document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{const d=read();const p=d.payments.find(x=>x.id===b.dataset.pay);p.status="pago";save(d);closeModal();render()});const ocr=$("[data-action='ocr']");if(ocr)ocr.onclick=()=>{const ta=$("textarea[name='text']");ta.value=ta.value||"Texto reconhecido da foto: a educação brasileira precisa aproximar tecnologia, leitura e acompanhamento docente para melhorar a escrita dos estudantes.";};document.querySelectorAll("[data-video]").forEach(b=>b.onclick=()=>video(b.dataset.video))}
  function submit(e){e.preventDefault();const f=e.target,d=read(),fd=new FormData(f);if(f.dataset.form==="chat"){d.messages.push({from:role==="student"?"Maria Clara":"Leonardo",text:fd.get("text")});save(d);render()} if(f.dataset.form==="essay"){d.essays.unshift({id:"R"+Date.now(),student:"Maria Clara",theme:fd.get("theme"),text:fd.get("text"),image:currentImage,status:"Pendente",score:null,competencies:[0,0,0,0,0],strengths:"",improve:"",feedback:""});save(d);closeModal();view="essays";render()} if(f.dataset.form==="lesson"){d.lessons.push({id:"A"+Date.now(),title:fd.get("title"),date:fd.get("date"),time:fd.get("time"),status:"Aberta"});save(d);closeModal();render()} if(f.dataset.form==="payment"){d.payments.unshift({id:"PIX-"+Date.now().toString().slice(-5),student:fd.get("student"),value:Number(fd.get("value")),status:"aberto",due:"Hoje"});save(d);closeModal();render()} if(f.dataset.form==="correct"){const x=d.essays.find(e=>e.id===f.dataset.id);x.status="Corrigida";x.score=Number(fd.get("score"));x.strengths=fd.get("strengths");x.improve=fd.get("improve");x.feedback=fd.get("feedback");save(d);closeModal();render()}}
  async function video(kind){const box=$("#videoBox");try{if(kind==="cam"){cameraStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true})} if(kind==="screen"){cameraStream=await navigator.mediaDevices.getDisplayMedia({video:true})} if(cameraStream){box.innerHTML='<video autoplay playsinline muted></video>';box.querySelector("video").srcObject=cameraStream}}catch(e){box.innerHTML='<div><h3 style="color:#fff">Permissão não liberada</h3><p>Ative câmera ou tela no navegador.</p></div>'}}
  boot();
  </script>
